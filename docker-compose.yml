services:
  docstatus-bot:
    build: .
    image: docstatus-bot:latest
    container_name: docstatus-bot
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Asia/Tashkent
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
    # Логи собирает Docker: docker compose logs -f
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
